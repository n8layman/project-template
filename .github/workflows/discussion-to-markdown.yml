name: Sync Discussion to Markdown

on:
  discussion:
    types:
      - created
      - edited
      - answered
      - deleted

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install dependencies
        run: |
          install.packages("httr")

      - name: Run sync script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCUSSION_ID: ${{ github.event.discussion.id }}  # Pass the discussion ID
        run: |
          Rscript scripts/sync_discussion_to_markdown.R