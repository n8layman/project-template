name: Process New Papers

on:
  push:
    paths:
      - 'resources/papers/**'
  workflow_dispatch:

jobs:
  process-papers:
    runs-on: ubuntu-latest
    container: rocker/tidyverse:4.3.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Required to persist credentials for pushing changes
          persist-credentials: true
          fetch-depth: 0  # Fetch full history (optional, but useful for git operations)

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpoppler-cpp-dev

      - name: Install required R packages
        run: |
          Rscript --vanilla -e "install.packages(c('pdftools', 'bibtex'), repos = 'https://cloud.r-project.org', ask = FALSE)"

      - name: Run R script
        run: |
          Rscript --vanilla scripts/process_papers.R

      - name: Configure Git
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Commit and push changes
        run: |
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update processed papers [skip ci]" && git push)