name: Process New Papers

on:
  push:
    paths:
      - 'resources/papers/**'
  workflow_dispatch:

jobs:
  process-papers:
    runs-on: ubuntu-latest
    container: rocker/tidyverse:4.3.1  # Use a specific Rocker R version

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install required R packages
        run: |
          Rscript --vanilla -e "install.packages(c('pdftools', 'bibtex')"

      - name: Run R script
        run: |
          Rscript --vanilla scripts/process_papers.R