name: Sync Markdown to Discussion

on:
  push:
    branches:
      - main
    paths:
      - 'resources/notes/**'  # Trigger only when Markdown files in resources/notes/ change

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install dependencies
        run: |
          install.packages("httr")

      - name: Run sync script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Rscript scripts/sync_markdown_to_discussion.R